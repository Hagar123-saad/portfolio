<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagar Abdellatif Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
            <nav>
                <a href="#"> Home </a>
                <a href="#"> Portfolio </a>
                <a href="#"> About</a>
                 <a href="#"> contact</a>
            </nav> 
            
            <a href="#" class="logo"> Hagar Abdillaif </a>
    </header>

    <main>
        <div class="HeroSection">

            <div class="HeroText">
                <h1>Hagar<br>Abdellatif</h1>
                <p>Visual Designer</p>
            </div>

            <div class="HeroSectionImage">
                <img src="images/HeroSection.png" alt="Hero Section Image">
            </div>

        
        </div>
    <hr>

        <div class="selectedWork">

            <div class="selectedWorkSection">
                 <h2>Selected Work</h2>
                <p>View All Project</p>
            </div>
           


            <div class="WorkCard">

                <div class="brandIdentity WorkItem">
                    <img src="images/Kofino .png" alt="kofino">
                    <p class="number">01</p>
                    <p class="nameOfCategory">Brand Identity</p>
                </div> 


                <div class="illustration WorkItem">
                <img src="images/Village.png" alt="village">
                <p class="number">02</p>
                <p class="nameOfCategory">Illustration</p>
                </div>


                <div class="Photography WorkItem">
                    <img src="images/flower.png" alt="flower">
                    <p class="number">03</p>
                    <p class="nameOfCategory">Photography</p>
                </div>


                <div class="GraphicDesign WorkItem">
                    <img src="images/collage.png" alt="collage">
                    <p class="number">04</p>
                    <p class="nameOfCategory">Graphic Design</p>
                </div>

                <div class="HandDrawn WorkItem">
                    <img src="images/hair.jpg" alt="hair">
                    <p class="number">05</p>
                    <p class="nameOfCategory">Hand Drawn art</p>
                </div>

            </div>
           
     <hr>

            

        </div>
    </main>

    <footer>

    </footer>
